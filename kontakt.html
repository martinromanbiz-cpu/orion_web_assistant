<link rel="stylesheet" href="assets/css/contact.css" />

<section class="contact-wrap">
  <div class="contact-card">
    <div class="contact-head">
      <div class="badge">Nezávazná konzultace</div>
      <h1>Kontakt</h1>
      <p>Napište mi krátce, co řešíte. Odpovím co nejdříve.</p>
    </div>

    <form id="orionContactForm" class="contact-form" novalidate>
      <div class="grid">
        <label>
          <span>Jméno*</span>
          <input name="name" type="text" autocomplete="name" placeholder="Jan Novák" required />
        </label>

        <label>
          <span>E-mail*</span>
          <input name="email" type="email" autocomplete="email" placeholder="jan@email.cz" required />
        </label>

        <label>
          <span>Telefon</span>
          <input name="phone" type="tel" autocomplete="tel" placeholder="+420 777 000 000" />
        </label>
      </div>

      <label class="full">
        <span>Zpráva*</span>
        <textarea name="message" rows="5" placeholder="Např. chci asistenta pro e-shop (FAQ + kontakty)…" required></textarea>
      </label>

      <div class="actions">
        <button type="submit" class="btn-primary">
          Odeslat
        </button>
        <span id="contactStatus" class="status" aria-live="polite"></span>
      </div>
    </form>

    <div id="contactSuccess" class="success" hidden>
      <h3>Děkuji</h3>
      <p>Zpráva byla odeslána. Ozvu se co nejdříve.</p>
      <button id="contactClose" class="btn-secondary" type="button">Zavřít</button>
    </div>
  </div>
</section>

<script src="assets/js/contact.js"></script>
