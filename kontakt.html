<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt | Orion – AI Web Assistant</title>
    <meta name="description" content="Nezávazná konzultace: napište mi a ozvu se co nejdříve." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/contact.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">
          <span class="brand-name">Martin Roman</span>
        </a>

        <nav class="nav">
          <a class="nav-link" href="index.html">Domů</a>
          <a class="nav-link" href="web-assistant.html">Web Assistant</a>
          <a class="nav-link" href="ukazky.html">Ukázky</a>
          <a class="nav-link" href="kontakt.html" aria-current="page">Kontakt</a>
        </nav>

        <div class="header-actions">
          <a class="btn btn-primary" href="web-assistant.html#demo">Spustit chat ↗</a>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="contact-hero">
        <div class="container">
          <div class="contact-card">
            <div class="contact-card__header">
              <span class="pill">Nezávazná konzultace</span>
              <h1>Kontakt</h1>
              <p>Napište mi krátce, co řešíte. Odpovím co nejdříve.</p>
            </div>

            <form id="contactForm" class="contact-form" novalidate>
              <div class="grid">
                <label class="field">
                  <span>Jméno*</span>
                  <input id="name" name="name" type="text" autocomplete="name" placeholder="Jan Novák" required />
                </label>

                <label class="field">
                  <span>E-mail*</span>
                  <input id="email" name="email" type="email" autocomplete="email" placeholder="jan@email.cz" required />
                </label>

                <label class="field">
                  <span>Telefon</span>
                  <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+420 777 000 000" />
                </label>
              </div>

              <label class="field">
                <span>Zpráva*</span>
                <textarea id="message" name="message" rows="6" placeholder="Např. chci asistenta pro e-shop (FAQ + kontakty)…" required></textarea>
              </label>

              <div class="form-actions">
                <button id="submitBtn" class="btn btn-primary" type="submit">Odeslat</button>
                <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-left">
          <strong>Orion</strong>
          <span class="muted">AI Web Assistant demo</span>
        </div>
        <div class="footer-right">
          <a class="link" href="jak-to-funguje.html">Jak to funguje</a>
          <span class="dot">•</span>
          <a class="link" href="kontakt.html">Kontakt</a>
        </div>
      </div>
    </footer>

    <!-- Config musí být načtený před kontaktním skriptem -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/contact.js"></script>
  </body>
</html>
