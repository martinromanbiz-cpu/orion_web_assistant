<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kontakt | Orion Web Assistant (DEMO)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/contact.css" />
</head>
<body>
  <header class="topbar">
    <div class="container navwrap">
      <a class="brand" href="index.html" aria-label="Orion Web Assistant">
        <img src="assets/img/orion-mark.svg" alt="Orion" />
        <span>Orion Web Assistant</span>
        <span class="pill">DEMO</span>
      </a>

      <nav class="menu" aria-label="Hlavní menu">
        <a href="./index.html">Domů</a>
        <a href="./web-assistant.html">Vyzkoušet</a>
        <a href="./jak-to-funguje.html">Jak to funguje</a>
        <a href="./ukazky.html">Ukázky</a>
        <a class="active cta" href="./kontakt.html">Kontakt</a>
      </nav>
    </div>
  </header>

  <main class="contact-wrap">
    <section class="contact-card" aria-label="Kontaktní formulář">
      <div class="contact-head">
        <span class="badge">Nezávazná poptávka</span>
        <h1>Kontakt</h1>
        <p>Po odeslání se zobrazí potvrzení a formulář se vyčistí.</p>
      </div>

      <form id="orionContactForm" class="contact-form" novalidate>
        <div class="grid">
          <label>
            <span>Jméno *</span>
            <input type="text" name="name" autocomplete="name" required />
          </label>
          <label>
            <span>E-mail *</span>
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label>
            <span>Telefon</span>
            <input type="tel" name="phone" autocomplete="tel" />
          </label>
        </div>

        <label class="full">
          <span>Zpráva *</span>
          <textarea name="message" rows="6" required placeholder="Např. web/e-shop, co má chatbot řešit, případně na čem web běží."></textarea>
        </label>

        <div class="actions">
          <button id="contactSubmit" class="btn-primary" type="submit">Odeslat</button>
          <button class="btn-secondary" type="button" onclick="location.href='web-assistant.html'">Vyzkoušet demo</button>
          <span id="contactStatus" class="status" aria-live="polite"></span>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="container foot">
      <span>© <span id="year"></span> Orion Web Assistant — demo ukázka</span>
      <span class="muted">CZ + lehce EN termíny</span>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/contact.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
