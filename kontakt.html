<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt | Orion AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/main.css">
<script src="./assets/js/config.js"></script>
<script src="./assets/js/app.js" defer></script>
<script src="./assets/js/contact.js" defer></script>
<style>
  .contact-container { max-width: 800px; margin: 0 auto; padding: 4rem 2rem; }
  .contact-card {
    background: var(--bg2);
    border: 0.5px solid var(--border2);
    border-radius: 16px;
    padding: 3rem;
  }
  .form-group { margin-bottom: 1.5rem; }
  .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text2); font-size: 0.9rem; }
  .form-control {
    width: 100%;
    background: var(--bg3);
    border: 0.5px solid var(--border2);
    color: var(--text);
    padding: 1rem;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    transition: border-color 0.2s;
  }
  .form-control:focus { outline: none; border-color: var(--accent); }
  textarea.form-control { resize: vertical; min-height: 120px; }
  #contactSuccess {
    text-align: center;
    padding: 3rem 1rem;
  }
</style>
</head>
<body>

<div id="siteHeader"></div>

<section class="hero" style="min-height: auto; padding-top: 10rem; padding-bottom: 2rem;">
  <div class="hero-glow"></div>
  <div class="badge"><div class="dot"></div> Jsme připraveni</div>
  <h1>Spojme  <span class="accent">síly</span></h1>
  <p class="hero-sub" style="margin-bottom: 0;">Domluvte si nazávaznou ukázku. Zjistíme zda vám Orion pomůže a kolik hodin týdně ušetříte.</p>
</section>

<div class="contact-container">
  <div class="contact-card">
    
    <div id="contactStatus" style="color: #ff6b6b; margin-bottom: 1rem; text-align: center; font-weight: 500;"></div>

    <form id="orionContactForm">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
        <div class="form-group">
          <label>Jméno a příjmení *</label>
          <input type="text" name="name" class="form-control" required placeholder="Jan Novák">
        </div>
        <div class="form-group">
          <label>E-mail *</label>
          <input type="email" name="email" class="form-control" required placeholder="jan@firma.cz">
        </div>
      </div>
      
      <div class="form-group">
        <label>Telefon</label>
        <input type="text" name="phone" class="form-control" placeholder="+420 123 456 789">
      </div>
      
      <div class="form-group">
        <label>Zpráva (co očekáváte od integrace?) *</label>
        <textarea name="message" class="form-control" required placeholder="Napište nám něco o vašem e-shopu..."></textarea>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; border: none; cursor: pointer; margin-top: 1rem;">Odeslat poptávku →</button>
      <p style="color: var(--text3); font-size: 0.8rem; text-align: center; margin-top: 1rem;">Odesláním formuláře souhlasíte se zpracováním osobních údajů.</p>
    </form>

    <div id="contactSuccess" hidden>
      <div style="font-size: 3rem; margin-bottom: 1rem;">🤝</div>
      <h3 style="margin-bottom: 1rem;">Děkujeme za váš zájem</h3>
      <p style="color: var(--text2); margin-bottom: 2rem;">Vaši zprávu jsme v pořádku přijali. Brzy se vám ozveme zpět.</p>
      <button id="contactClose" class="btn-secondary" style="border: none; cursor: pointer;">Odeslat další zprávu</button>
    </div>

  </div>
</div>

<div id="siteFooter"></div>

</body>
</html>
