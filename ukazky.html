<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ukázky | Orion Web Assistant (DEMO)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container navwrap">
      <a class="brand" href="index.html" aria-label="Orion Web Assistant">
        <img src="assets/img/orion-mark.svg" alt="Orion" />
        <span>Orion Web Assistant</span>
        <span class="pill">DEMO</span>
      </a>

      <nav class="menu" aria-label="Hlavní menu">
        <a href="./index.html">Domů</a>
        <a href="./web-assistant.html">Vyzkoušet</a>
        <a href="./jak-to-funguje.html">Jak to funguje</a>
        <a class="active" href="./ukazky.html">Ukázky</a>
        <a href="./kontakt.html" class="cta">Kontakt</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero small">
      <div class="container">
        <h1>Ukázky</h1>
        <p class="lead">Odkazy na další demo ukázky (bere se z config.js).</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="card">
          <h2>Dostupné ukázky</h2>
          <p class="muted">Seznam se naplní automaticky z <code>window.ORION_CONFIG.DEMO_LINKS</code>.</p>

          <div id="demoLinks" style="margin-top:12px;"></div>

          <div style="margin-top:14px;">
            <a class="btn" href="web-assistant.html">Otevřít hlavní demo</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container foot">
      <span>© <span id="year"></span> Orion Web Assistant — demo ukázka</span>
      <span class="muted">CZ + lehce EN termíny</span>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script>
    (function () {
      const root = document.getElementById("demoLinks");
      const links = (window.ORION_CONFIG && window.ORION_CONFIG.DEMO_LINKS) ? window.ORION_CONFIG.DEMO_LINKS : [];
      if (!links.length) {
        root.innerHTML = "<p class='muted'>DEMO_LINKS nejsou nastavené v config.js.</p>";
        return;
      }
      root.innerHTML = links.map(l => `
        <div class="card" style="margin-top:10px;">
          <strong>${l.title}</strong><br/>
          <a href="${l.url}" target="_blank" rel="noopener">${l.url}</a>
        </div>
      `).join("");
    })();
  </script>
  <script src="assets/js/app.js"></script>
</body>
</html>
